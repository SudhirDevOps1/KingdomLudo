apply plugin: 'com.android.application'

android {
    namespace "com.kingdomludo.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.kingdomludo.app"
        minSdk 24
        targetSdk 36
        versionCode System.getenv("ANDROID_VERSION_CODE")?.toInteger() ?: 100
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "0.1.0-alpha.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            def keystorePass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def keyAliasName = System.getenv("ANDROID_KEY_ALIAS")
            def keyPass = System.getenv("ANDROID_KEY_PASSWORD")

            if (keystorePath && keystorePass && keyAliasName && keyPass) {
                def keystoreFile = file(keystorePath)
                if (keystoreFile.exists()) {
                    storeFile keystoreFile
                    storePassword keystorePass
                    keyAlias keyAliasName
                    keyPassword keyPass
                } else {
                    logger.warn("WARNING: ANDROID_KEYSTORE_PATH specified but file does not exist: ${keystorePath}")
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("NOTICE: Release build will be UNSIGNED. Provide release keystore environment variables to sign.")
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation project(':capacitor-android')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, skipping google-services plugin")
}
