name: Android Release APK & AAB

on:
  release:
    types: [published, prereleased]
  push:
    tags:
      - 'v*'
      - 'kingdomludo-v*'
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build & attach APK/AAB (e.g. kingdomludo-v0.1.0-alpha.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Assets
        run: pnpm run build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Decode Release Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Generate Fallback Alpha Signing Keystore (when secret not set)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-keystore.jks \
            -alias kingdomludo-alpha \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "kingdomludo-alpha-pass" \
            -keypass "kingdomludo-alpha-pass" \
            -dname "CN=KingdomLudo Alpha, O=KingdomLudo, C=IN"
          echo "USE_FALLBACK_KEYSTORE=true" >> "$GITHUB_ENV"

      - name: Build Release APK & AAB
        working-directory: android
        env:
          HAS_SECRET_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PATH: ${{ (secrets.ANDROID_KEYSTORE_BASE64 != '' || env.USE_FALLBACK_KEYSTORE == 'true') && 'release-keystore.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'kingdomludo-alpha-pass' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'kingdomludo-alpha' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'kingdomludo-alpha-pass' }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease
          else
            gradle assembleRelease bundleRelease
          fi

      - name: Verify APK Signature (when signed)
        if: env.ANDROID_KEYSTORE_BASE64 != '' || env.USE_FALLBACK_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Verifying signature for $APK_FILE..."
            if command -v apksigner &> /dev/null; then
              apksigner verify --verbose "$APK_FILE"
            elif command -v jarsigner &> /dev/null; then
              jarsigner -verify -verbose -certs "$APK_FILE" | grep "jar verified" || true
            fi
          fi

      - name: Generate SHA256 Checksums
        if: success()
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/ 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/*.aab release-artifacts/ 2>/dev/null || true
          if [ "$(ls -A release-artifacts 2>/dev/null)" ]; then
            cd release-artifacts && sha256sum * > SHA256SUMS.txt
          fi

      - name: Attach Artifacts to GitHub Release
        if: inputs.tag_name != '' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if [ -z "$(ls -A release-artifacts 2>/dev/null)" ]; then
            echo "No release artifacts found to upload."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" release-artifacts/* --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Secure Clean Up Keystore
        if: always()
        run: |
          if [ -f android/app/release-keystore.jks ]; then
            shred -u -z -n 3 android/app/release-keystore.jks 2>/dev/null || rm -f android/app/release-keystore.jks
            echo "Release keystore securely shredded and removed."
          fi
